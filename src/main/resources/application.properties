
spring.application.name=rag-demo
server.port=8080

# Ollama configuration
ollama.base-url=http://localhost:11434

# Language model
ollama.chat-model=qwen2.5-coder:14b

# Embedding model
ollama.embedding-model=embeddinggemma

# Chunking configuration
rag.chunk-size=200
rag.chunk-overlap=40

# Retrieval configuration
rag.retrieval.top-k=3